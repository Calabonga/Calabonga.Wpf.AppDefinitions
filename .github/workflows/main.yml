name: Nuget Package Calabonga.Wpf.AppDefinitions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore src/Calabonga.Wpf.AppDefinitions/Calabonga.Wpf.AppDefinitions.csproj

      - name: Build and pack the NuGet package
        run: dotnet build src/Calabonga.Wpf.AppDefinitions/Calabonga.Wpf.AppDefinitions.csproj --configuration Release --no-restore

      - name: Publish NuGet Package
        run: dotnet nuget push "src/Calabonga.Wpf.AppDefinitions/bin/Release/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
