name: Nuget Package Calabonga.Wpf.AppDefinitions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore src/Calabonga.Wpf.AppDefinitions.sln

      - name: Pack the NuGet package
        run: dotnet pack src/Calabonga.Wpf.AppDefinitions.sln --configuration Release --no-restore --output "${{ github.workspace }}/artifacts"

      - name: Publish NuGet Package
        run: dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
