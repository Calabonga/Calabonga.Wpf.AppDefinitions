name: Nuget Package Calabonga.Wpf.AppDefinitions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore src/Calabonga.Wpf.AppDefinitions/Calabonga.Wpf.AppDefinitions.csproj

      - name: Build and pack the NuGet package
        run: dotnet build src/Calabonga.Wpf.AppDefinitions/Calabonga.Wpf.AppDefinitions.csproj --configuration Release --no-restore

      - name: Publish NuGet Package
        shell: pwsh
        run: |
          $package = Get-ChildItem src/Calabonga.Wpf.AppDefinitions/bin/Release/*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Select-Object -First 1
          if (-not $package) { throw 'No .nupkg found in bin/Release' }
          Write-Host "Pushing $($package.Name)"
          dotnet nuget push $package.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
